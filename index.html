<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta</title>

    <link rel="stylesheet" href="src/leaflet/leaflet.css" />
    <script src="src/leaflet/leaflet.js"></script>

    <script src="src/jquery-3.7.0/jquery.js"></script>

    <link rel="stylesheet" href="src/bootstrap-3.3.7/css/bootstrap.css" />
    <script src="src/bootstrap-3.3.7/js/bootstrap.js"></script>

    <link rel="stylesheet" href="src/geoman/leaflet-geoman.css" />
    <script src="src/geoman/leaflet-geoman.min.js"></script>

    <link rel="stylesheet" href="src/jquery-3.7.0/jquery-ui.min.css" />
    <script src="src/jquery-3.7.0/jquery-ui.min.js"></script>

    <link rel="stylesheet" href="src/easybutton/easy-button.css" />
    <script src="src/easybutton/easy-button.js"></script>

    <link rel="stylesheet" href="src/sidebar/L.Control.Sidebar.css" />
    <script src="src/sidebar/L.Control.Sidebar.js"></script>

    <script src="src/leaflet.providers/leaflet-providers.js"></script>

    <script src="src/leaflet.geoserver/L.Geoserver.js"></script>

    <script src="src/leaflet.ajax/leaflet-ajax.min.js"></script>

    <style>
      #mapdiv {
        block-size: 100vh;
      }

      .errorMsg {
        padding: 0;
        text-align: center;
        background-color: salmon;
      }

      .col-xs-12,
      .col-xs-6,
      .col-xs-4 {
        padding: 3px;
      }

      .ui-autocomplete {
        max-height: 80%;
        overflow-y: auto;
        /* prevent horizontal scrollbar */
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="side-bar" class="col-sm-3">
      <button id="btnLocate" class="btn btn-primary">Ubicame</button>

      <div id="divCol" class="col-xs-12">
        <div id="divColLabel" class="text-center col-xs-12"></div>
        <div id="divColoniaError" class="errorMsg col-xs-12"></div>
        <div id="divFindColonia" class="form-group">
          <div class="col-xs-6">
            <input
              type="text"
              id="txtFindColonia"
              class="form-control"
              placeholder="Nombre de colonia"
            />
          </div>
          <div class="col-xs-6">
            <button
              id="btnFindColonia"
              class="btn btn-primary btn-block"
              disabled
            >
              Buscar Colonia
            </button>
          </div>
        </div>
        <div id="divColoniaData"></div>
      </div>

      <div id="divDel" class="col-xs-12">
        <div id="divDelLabel" class="text-center col-xs-12"></div>
        <div id="divDelegacionError" class="errorMsg col-xs-12"></div>
        <div id="divFindDelegacion" class="form-group">
          <div class="col-xs-6">
            <input
              type="text"
              id="txtFindDelegacion"
              class="form-control"
              placeholder="Nombre de delegacion"
            />
          </div>
          <div class="col-xs-6">
            <button
              id="btnFindDelegacion"
              class="btn btn-primary btn-block"
              disabled
            >
              Buscar Delegación
            </button>
          </div>
        </div>
        <div id="divDelegacionData"></div>
      </div>

      <select name="" id="capa1" class="form-select col-xs-6">
        <option selected>Seleccione capa 1</option>
      </select>
      <select name="" id="capa2" class="form-select col-xs-6">
        <option selected>Seleccione capa 2</option>
      </select>
    </div>
    <div id="mapdiv" class="col-sm-12"></div>

    <script>
      var map2;
      var lyrOSM;
      var lyrEsri;
      var lyrContLumin;
      var lyrSearchCol;
      var lyrSearchDel;
      var ctrLayers;
      var ctrSidebar;
      var ctrEasybutton;
      var objBasemaps;
      var objOverlays;
      var capaColonias;
      var capaDelegaciones;
      var capaLuminarias;
      var mrkCurrentLocation;
      var arrayColonias = [];
      var arrayDelegaciones = [];
      var pointsLayer;
      var drawnPolygon;

      $(document).ready(function () {
        map2 = L.map("mapdiv", {
          center: [32.50079, -116.932811],
          zoom: 12,
        });

        map2.pm.addControls({
          position: "topleft",
          drawMarker: false,
          drawCircle: true,
          drawCircleMarker: false,
          drawText: false,
        });

        ctrSidebar = L.control
          .sidebar("side-bar", {
            closeButton: false,
          })
          .addTo(map2);
        ctrEasybutton = L.easyButton("glyphicon-log-out", function () {
          ctrSidebar.toggle();
        }).addTo(map2);

        lyrOSM = L.tileLayer.provider("OpenStreetMap.Mapnik");
        lyrEsri = L.tileLayer.provider("Esri.WorldImagery");
        map2.addLayer(lyrOSM);

        objBasemaps = {
          "Open Street Maps": lyrOSM,
          "Esri Imagery": lyrEsri,
        };

        pointsLayer = L.layerGroup().addTo(map2);
        drawnPolygon = L.layerGroup().addTo(map2);

        capaLuminarias = L.Geoserver.wms(
          "http://localhost:8080/geoserver/wms",
          {
            layers: "servicios:luminarias_2021",
            fitLayer: false,
          }
        );

        capaColonias = L.Geoserver.wfs("http://localhost:8080/geoserver/wfs", {
          layers: "catastro:colonias_2020",
          onEachFeature: function (feature, layer) {
            attr = feature.properties;
            geom = layer.getLatLngs();
            layer.bindPopup("<p>Colonia:<p>" + attr.colonia);
            if (!arrayColonias.includes(attr.colonia)) {
              arrayColonias.push(attr.colonia.toString());
            }
          },
          fitLayer: false,
          style: {
            color: "purple",
            opacity: "0.5",
          },
        });
        $(function () {
          $("#txtFindColonia").autocomplete({
            source: arrayColonias,
          });
        });

        capaColonias.on("click", function (event) {
          drawnPolygon.clearLayers();
          var selectedFeature = event.layer.toGeoJSON();
          lumProcess(selectedFeature.geometry);
          console.log(selectedFeature.geometry);
        });

        capaDelegaciones = L.Geoserver.wfs(
          "http://localhost:8080/geoserver/wfs",
          {
            layers: "gobierno:delegaciones_2013",
            onEachFeature: function (feature, layer) {
              attr = feature.properties;
              layer.bindPopup("<p>Delegacion:<p>" + attr.delegacion);
              if (!arrayDelegaciones.includes(attr.delegacion.toString())) {
                arrayDelegaciones.push(attr.delegacion.toString());
              }
            },
            fitLayer: false,
          }
        );
        $(function () {
          $("#txtFindDelegacion").autocomplete({
            source: arrayDelegaciones,
          });
        });

        objOverlays = {
          Luminarias: capaLuminarias,
          Delegaciones: capaDelegaciones,
          Colonias: capaColonias,
        };

        ctrLayers = L.control.layers(objBasemaps, objOverlays).addTo(map2);

        map2.on("pm:create", function (e) {
          drawnPolygon.clearLayers();
          const selectedRec = e.layer.toGeoJSON();
          drawnPolygon.addLayer(e.layer);
          lumProcess(selectedRec.geometry);
          console.log(selectedRec.geometry);
        });

        map2.on("locationfound", function (e) {
          if (mrkCurrentLocation) {
            mrkCurrentLocation.remove();
          }
          mrkCurrentLocation = L.circleMarker(e.latlng, {
            radius: 12,
            opacity: 1,
            transparency: 0,
          }).addTo(map2);
          console.log(mrkCurrentLocation.toGeoJSON());
          map2.setView(e.latlng, 16);
        });

        map2.on("locationerror", function (e) {
          console.log(e);
          alert("Lacalizacion no encontrada");
        });

        $("#btnLocate").click(function () {
          map2.locate();
        });

        //PARA SEARCH DE COLONIA

        document.getElementById("btnFindColonia").onclick = function () {
          var col = document
            .getElementById("txtFindColonia")
            .value.toUpperCase();
          var lyr = returnLayerByName(capaColonias, "colonia", col);
          if (lyr) {
            if (lyrSearchCol) {
              lyrSearchCol.remove();
            }
            lyrSearchCol = L.geoJSON(lyr.toGeoJSON(), {
              style: { color: "red", weigth: 10, opacity: 0.5 },
            }).addTo(map2);
            map2.fitBounds(lyr.getBounds().pad(1));
            $("#divFindColonia").removeClass("has-error");
            $("#divColoniaError").html("");
            var attr = lyr.feature.properties;
            $("#divColoniaData").html(
              "<h4 clas='text-center'>Atributos</h4><h5>Colonia: " +
                attr.colonia +
                "</h5><h5>Area: " +
                attr.area +
                " m </h5>"
            );
          } else {
            $("#divColoniaError").html("****** Colonia no excontrada ******");
          }
        };

        $("#txtFindColonia").on("keyup paste", function () {
          var col = $("#txtFindColonia").val();
          testLayerNameStatus(
            arrayColonias,
            col,
            "#divFindColonia",
            "#btnFindColonia"
          );
        });

        //PARA SEARCH DE DELEGACION

        document.getElementById("btnFindDelegacion").onclick = function () {
          var del = document.getElementById("txtFindDelegacion").value;
          var lyr = returnLayerByName(capaDelegaciones, "delegacion", del);
          if (lyr) {
            if (lyrSearchDel) {
              lyrSearchDel.remove();
            }
            lyrSearchDel = L.geoJSON(lyr.toGeoJSON(), {
              style: { color: "yellow", weigth: 10, opacity: 0.5 },
            }).addTo(map2);
            map2.fitBounds(lyr.getBounds().pad(1));
            $("#divFindDelegacion").removeClass("has-error");
            $("#divDelegacionError").html("");
            var attr = lyr.feature.properties;
            $("#divDelegacionData").html(
              "<h4 clas='text-center'>Atributos</h4><h5>Delegacion: " +
                attr.delegacion +
                "</h5><h5>Area: " +
                attr.area +
                " m </h5>"
            );
          } else {
            $("#divDelegacionError").html(
              "****** Delegacion no excontrada ******"
            );
          }
        };

        $("#txtFindDelegacion").on("keyup paste", function () {
          var del = $("#txtFindDelegacion").val();
          testLayerNameStatus(
            arrayDelegaciones,
            del,
            "#divFindDelegacion",
            "#btnFindDelegacion"
          );
        });

        // FORMULAS GENERALES

        function returnLayerByName(lyr, att, val) {
          var arLayer = lyr.getLayers();
          for (i = 0; i < arLayer.length; i++) {
            var featureCol = arLayer[i].feature.properties[att];
            if (featureCol == val) {
              return arLayer[i];
            }
          }
          return false;
        }

        function testLayerNameStatus(arr, val, divFind, btnFind) {
          if (arr.indexOf(val) < 0) {
            $(divFind).addClass("has-error");
            $(btnFind).attr("disabled", false);
          } else {
            $(divFind).removeClass("has-error");
            $(btnFind).attr("disabled", true);
          }
        }

        function lumProcess(geom) {
          pointsLayer.clearLayers();
          $.ajax({
            type: "POST",
            url: "dataExtractor.php",
            data: JSON.stringify(geom),
            contentType: 'json',
            success: function (data) {
              const intersectedGeoJSON = JSON.parse(data);
              L.geoJSON(intersectedGeoJSON, {
                pointToLayer: function(feature, latlng) {
                  return L.circleMarker(latlng, {
                      radius: 3,
                      fillColor: 'yellow',
                      color: 'black',
                      weight: 1,
                      opacity: 1,
                      fillOpacity: 0.8
                  })},
                onEachFeature: function (feature, layer) {
                  pointsLayer.addLayer(layer);
                }
              }).addTo(map2);
            },
            error: function (error) {
              console.error("Error:", error);
            },
          });
        }
      });
    </script>
  </body>
</html>
