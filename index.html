<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de Acceso a la Información</title>

    <link rel="stylesheet" href="src/leaflet/leaflet.css" />
    <script src="src/leaflet/leaflet.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <script src="src/jquery-3.7.0/jquery.js"></script>

    <link rel="stylesheet" href="src/jquery-3.7.0/jquery-ui.min.css" />
    <script src="src/jquery-3.7.0/jquery-ui.min.js"></script>

    <script src="src/L.crs/proj4leaflet.js"></script>

    <script src="src/leaflet.ajax/leaflet-ajax.min.js"></script>

    <script src="src/wfst/leaflet-wfst.src.js"></script>

    <script src="src/leaflet.geoserver/L.Geoserver.js"></script>

    <link rel="stylesheet" href="src/bootstrap-5.3.1-dist/css/bootstrap.min.css" />
    <script src="src/bootstrap-5.3.1-dist/js/bootstrap.min.js"></script>

    <link rel="stylesheet" href="src/fontawesome-6.4.2/css/all.min.css" />
    <script src="src/fontawesome-6.4.2/js/all.min.js"></script>

    <script src="src/turf/turf.min.js"></script>

    <link rel="stylesheet" href="src/geoman/leaflet-geoman.css" />
    <script src="src/geoman/leaflet-geoman.min.js"></script>

    <link rel="stylesheet" href="src/easybutton/easy-button.css" />
    <script src="src/easybutton/easy-button.js"></script>

    <link rel="stylesheet" href="src/sidebar/L.Control.Sidebar.css" />
    <script src="src/sidebar/L.Control.Sidebar.js"></script>

    <link rel="stylesheet" href="src/L.switchBasemap/L.switchBasemap.css" />
    <script src="src/L.switchBasemap/L.switchBasemap.js"></script>

    <script src="src/leaflet.providers/leaflet-providers.js"></script>

    <link rel="stylesheet" href="src/leaflet.searchbox/Leaflet.AnimatedSearchBox.css" />
    <script src="src/leaflet.searchbox/Leaflet.AnimatedSearchBox.js"></script>

    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

    <script>
      function switchLayers(lyrId, lyrName) {
        var lyr = document.getElementById(lyrId);
        if (lyr.checked) {
          console.log('is now active');
          lyrName.addTo(map2);
        } else {
          console.log({lyrName} +'is not  active');
          map2.removeLayer(lyrName);
        }
      }
    </script>

    <style>

      :root { font-family: 'Inter', sans-serif; }
      @supports (font-variation-settings: normal) {
        :root { font-family: 'Inter var', sans-serif; }
      }

      html,
      body,
      #mapdiv {
        height: 100%;
        font-family: inter;
      }

      .errorMsg {
        padding: 0;
        text-align: center;
        background-color: salmon;
      }

      .col-xs-12,
      .col-xs-6,
      .col-xs-4 {
        padding: 3px;
      }

      .ui-autocomplete {
        max-height: 80%;
        overflow-y: auto;
        /* prevent horizontal scrollbar */
        overflow-x: hidden;
      }
    </style>
  </head>

  <body>
    <div id="side-bar" class="sidebar collapsed" style="border-radius: 1rem;">
      <div id="divCol" class="col-sm-12 mt-4">
        <div id="divColLabel" class="text-center col-sm-12"></div>
        <div id="divColoniaError" class="errorMsg col-xs-12"></div>
        <div
          id="divFindColonia"
          class="form-group d-flex justify-content-between col-sm-12 mt-3"
        >
          <div class="col-sm-10">
            <input
              type="text"
              id="txtFindColonia"
              class="form-control"
              placeholder="Buscar colonia"
            />
          </div>
          <div class="col-sm-2">
            <button
              id="btnFindColonia"
              class="btn btn-block"
              style="color:white; background-color: #FF7D04;"
              disabled
            >
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>
        <div id="divColoniaData"></div>
      </div>

      <div id="divDel" class="col-sm-12 mt-4">
        <div id="divDelLabel" class="text-center col-sm-12"></div>
        <div id="divDelegacionError" class="errorMsg col-xs-12"></div>
        <div
          id="divFindDelegacion"
          class="form-group d-flex justify-content-between col-sm-12 mt-3"
        >
          <div class="col-sm-10">
            <input
              type="text"
              id="txtFindDelegacion"
              class="form-control"
              placeholder="Buscar delegación"
            />
          </div>
          <div class="col-sm-2">
            <button
              id="btnFindDelegacion"
              class="btn btn-block"
              style="color:white; background-color: #FF7D04;"
              disabled
            >
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>
        <div id="divDelegacionData"></div>
      </div>

      <ul class="list-group mt-4" style="list-style-type: none">
        <li class="form-control list-group-item list-group-item-action list-group-item-warning">
          <div class="form-switch">
            <input
              class="form-check-input me-3"
              type="checkbox"
              id="switchDelegaciones"
              onchange="switchLayers('switchDelegaciones', capaDelegaciones)"
            />Delegaciones
          </div>
        </li>
        <li
          class="form-control list-group-item list-group-item-action list-group-item-warning"
        >
          <div class="form-switch">
            <input
              class="form-check-input me-3"
              type="checkbox"
              id="switchColonias"
              onchange="switchLayers('switchColonias', capaColonias)"
            />Colonias
          </div>
        </li>
        <!-- <li class="form-control list-group-item list-group-item-action list-group-item-warning">
          <div class="form-switch">
            <input
              class="form-check-input me-3"
              type="checkbox"
              id="switchLuminarias"
              onchange="switchLayers('switchLuminarias', capaLuminarias)"
            />Luminarias
          </div>
        </li> -->
        <li class="form-control list-group-item list-group-item-action list-group-item-warning">
          <div class="form-switch">
            <input
              class="form-check-input me-3"
              type="checkbox"
              id="switchRutasReco"
              onchange="switchLayers('switchRutasReco', capaRutasReco)"
            />Rutas de Recolección
          </div>
        </li>
        <li
          class="form-control list-group-item list-group-item-action list-group-item-warning"
        >
          <div class="form-switch">
            <input
              class="form-check-input me-3"
              type="checkbox"
              id="switchFortamun"
              onchange="switchLayers('switchFortamun', capaFortamun)"
            />Bacheo Fortamun
          </div>
        </li>
        <li
          class="form-control list-group-item list-group-item-action list-group-item-warning"
        >
          <div class="form-switch">
            <input
              class="form-check-input me-3"
              type="checkbox"
              id="switchDesarenadores"
              onchange="switchLayers('switchDesarenadores', capaDesarenadores)"
            />Desarenadores
          </div>
        </li>
      </ul>

      <div id="tablaEst" class="text-center col-sm-12 mt-4"></div>

      <div class="d-grid gap-2">
        <button id="btnLocate" class="btn mt-4" style="color:white; background-color: #FF7D04;">Ubicame</button>
      </div>

      <div class='text-center mt-3'>
        <label id="lblRadioDist" class="form-label" for="radioDist">Radio: 500 m</label>
        <input type="range" id="radioDist" class="form-range" name="radioDist" min="300" max="1000" value="500" step="100" />
      </div>

    </div>
    <div id="mapdiv"></div>

    <script>
      var map2;
      var lyrOSM;
      var lyrEsri;
      var lyrContLumin;
      var lyrSearchCol;
      var lyrSearchDel;
      var lyrCurrentLoc;
      var jsonCurrentLocation;
      var ctrLayers;
      var ctrSidebar;
      var ctrEasybutton;
      var objBasemaps;
      var objOverlays;
      var capaColonias;
      var capaDelegaciones;
      var capaLuminarias;
      var capaSubsectores;
      var mrkCurrentLocation;
      var arrayColonias = [];
      var arrayDelegaciones = [];
      var pointsLayer;
      var drawnPolygon;
      var crs32611;
      var searchbox;

      $(document).ready(function () {
        map2 = L.map("mapdiv", {
          center: [32.50079, -116.932811],
          zoom: 12,
        });

        map2.pm.addControls({
          position: "topleft",
          drawMarker: false,
          drawCircle: true,
          drawCircleMarker: false,
          drawPolyline: false,
          drawText: false,
          editMode: false,
          dragMode: false,
          cutPolygon: false,
          removalMode: false,
          rotateMode: false,
        });

        ctrSidebar = L.control
          .sidebar("side-bar", { closeButton: false })
          .addTo(map2);

        ctrEasybutton = L.easyButton("fas fa-arrow-right", function () {
          ctrSidebar.toggle();
        }).addTo(map2);

        searchbox = L.control
          .searchbox({
            position: "topright",
            expand: "left",
            collapsed: true,
            id: "searchItem",
            autocompleteFeatures: "setValueOnClick",
            iconPath: "./assets/img/search_icon.png",
          })
          .addTo(map2);

        new L.basemapsSwitcher(
          [
            {
              layer: L.tileLayer.provider("OpenStreetMap.Mapnik").addTo(map2),
              icon: "./assets/img/osm_switch.png",
              name: "OSM",
            },
            {
              layer: L.tileLayer.provider("Esri.WorldImagery"),
              icon: "./assets/img/esri_switch.png",
              name: "Esri Map",
            },
          ],
          { position: "bottomleft" }
        ).addTo(map2);

        objBasemaps = {
          "Open Street Maps": lyrOSM,
          "Esri Imagery": lyrEsri,
        };

        pointsLayer = L.layerGroup().addTo(map2);
        drawnPolygon = L.layerGroup().addTo(map2);

        crs32611 = new L.Proj.CRS(
          "EPSG:32611",
          "+proj=utm +zone=11 +datum=WGS84 +units=m +no_defs +type=crs"
        );

        // capaLuminarias = L.Geoserver.wms("https://www.clustersig.com/geoserver/wms", {
        //   layers: "servicios:luminarias",
        //   format: 'image/png',
        // });

        capaDelegaciones = new L.WFS({
          url: "https://www.clustersig.com/geoserver/wfs",
          typeNS: "gobierno",
          typeName: "delegaciones",
          geometryField: "geom",
          fillOpacity: 0.1,
          opacity: 1,
          style: {
            color: "black",
            weight: 3,
            fillColor: "white",
          },
        }).on("load", function (e) {
          var capad = e.target.toGeoJSON();
          L.geoJSON(capad, {
            onEachFeature: function (feature, layer) {
              attr = feature.properties;
              layer.bindPopup("<p>Delegacion:<p>" + attr.delegacion).openPopup();
              if (!arrayDelegaciones.includes(attr.delegacion)) {
                arrayDelegaciones.push(attr.delegacion.toString());
              }
            },
          });
        });
        $(function () {
          $("#txtFindDelegacion").autocomplete({
            source: arrayDelegaciones,
          });
        });

        capaRutasReco = new L.WFS({
          url: "https://www.clustersig.com/geoserver/wfs",
          typeNS: "servicios",
          typeName: "rutas_recoleccion",
          geometryField: "geom",
          crs: crs32611,
          opacity: 0.8,
          style: {
            color: "orange",
            weight: 2,
          },
        })
        // .on("load", function (e) {
        //   var capar = e.target.toGeoJSON();
        //   L.geoJSON(capar, {
        //     onEachFeature: function (feature, layer) {
        //       pointOnPolygon = turf.pointOnFeature(layer.toGeoJSON());
        //       L.geoJSON(pointOnPolygon, {
        //         pointToLayer: function (feature, latlng) {
        //           return L.circleMarker(latlng, {
        //             radius: 3,
        //             fillColor: "purple",
        //             color: "black",
        //             weight: 1,
        //             fillOpacity: 1,
        //           });
        //         },
        //       }).addTo(map2);
        //     }
        //   })
        // })
        ;


        capaFortamun = new L.WFS({
            url: "https://www.clustersig.com/geoserver/wfs",
            typeNS: "doium",
            typeName: "poligon_fortamun",
            geometryField: "geom",
            crs: crs32611,
            opacity: 0.8,
            fillOpacity: 0.4,
            style: {
              color: "black",
              fillColor: "black",
            },
          });

        capaDesarenadores = new L.WFS({
          url: "https://www.clustersig.com/geoserver/wfs",
          typeNS: "doium",
          typeName: "desarenadores",
          geometryField: "geom",
          crs: crs32611,
        });

        capaColonias = new L.WFS({
          url: "https://www.clustersig.com/geoserver/wfs",
          typeNS: "catastro",
          typeName: "colonias",
          geometryField: "geom",
          fillOpacity: 0.1,
          style: {
            fillColor: "white",
            color: "#ac905b",
            weight: 2,
          },
        }).on("load", function (e) {
          var capa = e.target.toGeoJSON();
          L.geoJSON(capa, {
            onEachFeature: function (feature, layer) {
              attr = feature.properties;
              if (attr && attr.nomb_fracc !== undefined) {
                if (!arrayColonias.includes(attr.nomb_fracc)) {
                  arrayColonias.push(attr.nomb_fracc.toString());
                }
              }
            },
          });
        });
        $(function () {
          $("#txtFindColonia").autocomplete({
            source: arrayColonias,
          });
        });
        
        capaColonias.on("click", function (event) {
          if (mrkCurrentLocation) {
            mrkCurrentLocation.remove();
            lyrCurrentLoc.remove();
          }
          drawnPolygon.clearLayers();
          var selectedFeature = event.layer.toGeoJSON();
          event.layer.bindPopup('colonia: ' + selectedFeature.properties.nomb_fracc).openPopup();
          lumProcess(selectedFeature.geometry);
        });

        // objOverlays = {
        //   Luminarias: capaLuminarias,
        //   Subsectores: capaSubsectores,
        //   Colonias: capaColonias,
        //   Delegaciones: capaDelegaciones,
        //   'Rutas Recolección': capaRutasReco,
        //   'Bacheo Fortamun': capaFortamun,
        //   Desarenadores: capaDesarenadores
        // };
        // ctrLayers = L.control.layers('' ,objOverlays).addTo(map2);

        map2.on("pm:create", function (e) {
          drawnPolygon.clearLayers();
          const selectedRec = e.layer.toGeoJSON();
          drawnPolygon.addLayer(e.layer);
          lumProcess(selectedRec.geometry);
          console.log(selectedRec.geometry);
        });


        document.getElementById('radioDist').addEventListener('change', (event)=>{
            label = document.getElementById('lblRadioDist');
            label.innerHTML = "Radio: " + event.target.value + " m";
          });

        map2.on("locationfound", function (e) {
          if (mrkCurrentLocation) {
            mrkCurrentLocation.remove();
            lyrCurrentLoc.remove();
          }
          mrkCurrentLocation = L.marker(e.latlng).addTo(map2);
          map2.setView(e.latlng, 16);
          var radioInput = document.getElementById('radioDist');
          var radioValue = (radioInput.value)/1000;


          jsonCurrentLocation = turf.buffer(mrkCurrentLocation.toGeoJSON(),
            radioValue,
            { units: "kilometers" }
          );
          
          lyrCurrentLoc = L.geoJSON(jsonCurrentLocation, {
            style: { color: "blue", fillColor: "blue", fillOpacity: 0.2 },
          }).addTo(map2);

          drawnPolygon.clearLayers();
          lumProcess(jsonCurrentLocation.geometry);
        });


        map2.on("locationerror", function (e) {
          console.log(e);
          alert("Lacalizacion no encontrada");
        });

        $("#btnLocate").click(function () {
          map2.locate();
        });

        //PARA SEARCH DE COLONIA

        document.getElementById("btnFindColonia").onclick = function () {
          var col = document
            .getElementById("txtFindColonia")
            .value.toUpperCase();
          var lyr = returnLayerByName(capaColonias, "nomb_fracc", col);
          var area = turf.area(lyr.toGeoJSON());
          if (lyr) {
            if (lyrSearchCol) {
              lyrSearchCol.remove();
            }
            lyrSearchCol = L.geoJSON(lyr.toGeoJSON(), {
              style: { color: "red", fillColor: "none", weigth: 10, opacity: 0.5 },
            }).addTo(map2);
            map2.fitBounds(lyr.getBounds().pad(1));
            $("#divFindColonia").removeClass("has-error");
            $("#divColoniaError").html("");
            var attr = lyr.feature.properties;
            $("#divColoniaData").html(
              "<h6>Colonia: " + attr.nomb_fracc + "</h6><h6>Area: " +
                area +
                " m2 </h6>"
            );
          } else {
            $("#divColoniaError").html("****** Colonia no encontrada ******");
          }
        };

        $("#txtFindColonia").on("keyup paste", function () {
          var col = $("#txtFindColonia").val();
          testLayerNameStatus(
            arrayColonias,
            col,
            "#divFindColonia",
            "#btnFindColonia"
          );
        });

        //PARA SEARCH DE DELEGACION

        document.getElementById("btnFindDelegacion").onclick = function () {
          var del = document.getElementById("txtFindDelegacion").value;
          var lyr = returnLayerByName(capaDelegaciones, "delegacion", del);
          var area = turf.area(lyr.toGeoJSON());
          if (lyr) {
            if (lyrSearchDel) {
              lyrSearchDel.remove();
            }
            lyrSearchDel = L.geoJSON(lyr.toGeoJSON(), {
              style: { color: "red", fillColor: "none", weigth: 10, opacity: 0.5 },
            }).addTo(map2);
            map2.fitBounds(lyr.getBounds().pad(1));
            $("#divFindDelegacion").removeClass("has-error");
            $("#divDelegacionError").html("");
            var attr = lyr.feature.properties;
            $("#divDelegacionData").html(
              "<h6>Delegación: " + attr.delegacion +
                "</h6><h6>Area: " +
                area +
                " m2 </h6>"
            );
          } else {
            $("#divDelegacionError").html(
              "****** Delegacion no encontrada ******"
            );
          }
        };

        $("#txtFindDelegacion").on("keyup paste", function () {
          var del = $("#txtFindDelegacion").val();
          testLayerNameStatus(
            arrayDelegaciones,
            del,
            "#divFindDelegacion",
            "#btnFindDelegacion"
          );
        });

        // FORMULAS GENERALES

        function returnLayerByName(lyr, att, val) {
          var arLayer = lyr.getLayers();
          for (i = 0; i < arLayer.length; i++) {
            var featureCol = arLayer[i].feature.properties[att];
            if (featureCol == val) {
              return arLayer[i];
            }
          }
          return false;
        }

        function testLayerNameStatus(arr, val, divFind, btnFind) {
          if (arr.indexOf(val) < 0) {
            $(divFind).addClass("has-error");
            $(btnFind).attr("disabled", false);
          } else {
            $(divFind).removeClass("has-error");
            $(btnFind).attr("disabled", true);
          }
        }

        function lumProcess(geom) {
          pointsLayer.clearLayers();
          $.ajax({
            type: "POST",
            url: "dataExtractor.php",
            data: JSON.stringify(geom),
            contentType: "json",
            success: function (data) {
              const intersectedGeoJSON = JSON.parse(data);
              $("#tablaEst").html(
                "<h4 class='text-center'>Atributos de Selección</h4><h5>Cantidad de Luminarias: " +
                  intersectedGeoJSON.features.length +
                  "</h5>"
              );
              L.geoJSON(intersectedGeoJSON, {
                pointToLayer: function (feature, latlng) {
                  return L.circleMarker(latlng, {
                    radius: 3,
                    fillColor: "yellow",
                    color: "black",
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 1,
                  });
                },
                onEachFeature: function (feature, layer) {
                  pointsLayer.addLayer(layer);
                },
              }).addTo(map2);
            },
            error: function (error) {
              console.error("Error:", error);
            },
          });
        }
      });
    </script>
  </body>
</html>
