<body>
    
    <div id="side-bar" class="col-sm-1">
        <button id="btnLocate" class="btn btn-primary">Ubicame</button>
        <select name="" id="capa1">
            <option selected>Seleccione capa 1</option>
        </select>
        <select name="" id="capa2">
            <option selected>Seleccione capa 2</option>
        </select>
    </div>
    <div id="mapdiv" class="col-sm-12"></div>

    <script>
        var map2;
        var lyrOSM;
        var lyrEsri;
        var lyrContLumin;
        var ctrLayers;
        var ctrSidebar;
        var ctrEasybutton;
        var objBasemaps;
        var objOverlays;
        var capaColonias;
        var capaDelegaciones;
        var capaLuminarias;
        var mrkCurrentLocation;

        $(document).ready(function () {
        map2 = L.map("mapdiv", {
          center: [32.50079, -116.932811],
          zoom: 12,
        });


        map2.pm.addControls({
          position: 'topleft',
          drawMarker: false,
          drawCircle: false,
          drawCircleMarker: false,
          drawText: false
        });
        map2.on("pm:create", function(e){
          console.log(e);
          fgpRio1.addLayer(e.layer);
        });

        ctrSidebar = L.control.sidebar('side-bar', {
          closeButton: false
        }).addTo(map2);
        ctrEasybutton = L.easyButton('glyphicon-log-out', function(){
          ctrSidebar.toggle();
        }).addTo(map2);

        lyrOSM = L.tileLayer.provider('OpenStreetMap.Mapnik');
        lyrEsri = L.tileLayer.provider('Esri.WorldImagery');
        map2.addLayer(lyrOSM);

        objBasemaps = {
          'Open Street Maps': lyrOSM,
          'Esri Imagery': lyrEsri
        };


        // function peticionAjax(url) {

        //           resolve(xhr.response);
        //         } else {
        //           reject(Error(xhr.statusText));
        //         }
        //       };
        //       xhr.onerror = function () {
        //         reject(Error('Error de red'));
        //       };;
        //       xhr.send();
        //     }
        //   );
        // };
        
        // var urlTerremotos = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_month.geojson";

        // peticionAjax(urlTerremotos)
        //   .then(function (respuesta) {
        //     var datos = JSON.parse(respuesta);
        //     var capaVectorial = L.geoJSON(datos);
        //     capaVectorial.addTo(mapa);
        //   })
        //   .catch(function (respuesta) {
        //     alert(respuesta);
        //   });


        capaColonias = L.Geoserver.wfs('http://localhost:8080/geoserver/wfs', {
            layers: 'catastro:colonias_2020',
            onEachFeature: function (feature, layer) {
              layer.bindPopup('<p>Colonia:<p>'+feature.properties.colonia);
            },
            fitLayer: false,
            style: {
              color: "purple",
              opacity: "0.5",
            }
          });

          capaDelegaciones = L.Geoserver.wfs('http://localhost:8080/geoserver/wfs', {
            layers: 'gobierno:delegaciones_2013',
            fitLayer: false
        });

        // capaLuminarias = L.Geoserver.wfs('http://localhost:8080/geoserver/wfs', {
        //     layers: 'servicios:luminarias_2021'
        // });


        objOverlays = {
            'Delegaciones': capaDelegaciones, 
            'Colonias': capaColonias
            // 'Luminarias': capaLuminarias 
        };

        ctrLayers = L.control.layers(objBasemaps, objOverlays).addTo(map2);


        map2.on("locationfound", function (e) {
          if (mrkCurrentLocation) {
            mrkCurrentLocation.remove();
          }
          mrkCurrentLocation = L.circle(e.latlng, {
            radius: 600,
          }).bindTooltip('Hello im here').addTo(map2);
          map2.setView(e.latlng, 14);
        });

        map2.on("locationerror", function (e) {
          console.log(e);
          alert("Lacalizacion no encontrada");
        });


        $("#btnLocate").click(function () {
          map2.locate();
        });

    });

    </script>

</body>
