<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta</title>

    <link rel="stylesheet" href="src/leaflet/leaflet.css" />
    <script src="src/leaflet/leaflet.js"></script>

    <script src="src/jquery-3.7.0/jquery.js"></script>

    <link rel="stylesheet" href="src/bootstrap-3.3.7/css/bootstrap.css" />
    <script src="src/bootstrap-3.3.7/js/bootstrap.js"></script>

    <link rel="stylesheet" href="src/geoman/leaflet-geoman.css" />
    <script src="src/geoman/leaflet-geoman.min.js"></script>
    
    <link rel="stylesheet" href="src/jquery-3.7.0/jquery-ui.min.css" />
    <script src="src/jquery-3.7.0/jquery-ui.min.js"></script>

    <link rel="stylesheet" href="src/easybutton/easy-button.css" />
    <script src="src/easybutton/easy-button.js"></script>

    <link rel="stylesheet" href="src/sidebar/L.Control.Sidebar.css" />
    <script src="src/sidebar/L.Control.Sidebar.js"></script>

    <script src="src/leaflet.providers/leaflet-providers.js"></script>

    <script src="src/leaflet.geoserver/L.Geoserver.js"></script>

    <script src="src/leaflet.ajax/leaflet-ajax.min.js"></script>

    <style>
      #mapdiv {
        block-size: 100vh;
      }

      .errorMsg {
        padding: 0;
        text-align: center;
        background-color: salmon;
      }

      .col-xs-12,
      .col-xs-6,
      .col-xs-4 {
        padding: 3px;
      }
    </style>
  </head>
  <body>
    <div id="side-bar" class="col-sm-3">
      <button id="btnLocate" class="btn btn-primary">Ubicame</button>

      <div id="divCol" class="col-xs-12">
        <div id="divColLabel" class="text-center col-xs-12"></div>
        <div id="divColoniaError" class="errorMsg col-xs-12"></div>
        <div id="divFindColonia" class="form-group">
          <div class="col-xs-6">
            <input
              type="text"
              id="txtFindColonia"
              class="form-control"
              placeholder="Nombre de colonia"
            />
          </div>
          <div class="col-xs-6">
            <button id="btnFindColonia" class="btn btn-primary btn-block" disabled>
              Buscar Colonia
            </button>
          </div>
        </div>
        <div id="divColoniaData"></div>
      </div>

      <div id="divDel" class="col-xs-12">
        <div id="divDelLabel" class="text-center col-xs-12"></div>
        <div id="divDelegacionError" class="errorMsg col-xs-12"></div>
        <div id="divFindDelegacion" class="form-group">
          <div class="col-xs-6">
            <input
              type="text"
              id="txtFindDelegacion"
              class="form-control"
              placeholder="Nombre de delegacion"
            />
          </div>
          <div class="col-xs-6">
            <button id="btnFindDelegacion" class="btn btn-primary btn-block" disabled>
              Buscar Delegación
            </button>
          </div>
        </div>
      </div>

      <select name="" id="capa1" class="form-select col-xs-6">
        <option selected>Seleccione capa 1</option>
      </select>
      <select name="" id="capa2" class="form-select col-xs-6">
        <option selected>Seleccione capa 2</option>
      </select>
    </div>
    <div id="mapdiv" class="col-sm-12"></div>

    <script>
      var map2;
      var lyrOSM;
      var lyrEsri;
      var lyrContLumin;
      var lyrSearchCol;
      var lyrSearchDel;
      var ctrLayers;
      var ctrSidebar;
      var ctrEasybutton;
      var objBasemaps;
      var objOverlays;
      var capaColonias;
      var capaDelegaciones;
      var capaLuminarias;
      var mrkCurrentLocation;
      var arrayColonias = [];
      var arrayDelegaciones = [];

      $(document).ready(function () {
        map2 = L.map("mapdiv", {
          center: [32.50079, -116.932811],
          zoom: 12,
        });

        map2.pm.addControls({
          position: "topleft",
          drawMarker: false,
          drawCircle: false,
          drawCircleMarker: false,
          drawText: false,
        });

        ctrSidebar = L.control
          .sidebar("side-bar", {
            closeButton: false,
          })
          .addTo(map2);
        ctrEasybutton = L.easyButton("glyphicon-log-out", function () {
          ctrSidebar.toggle();
        }).addTo(map2);


        lyrOSM = L.tileLayer.provider("OpenStreetMap.Mapnik");
        lyrEsri = L.tileLayer.provider("Esri.WorldImagery");
        map2.addLayer(lyrOSM);

        objBasemaps = {
          "Open Street Maps": lyrOSM,
          "Esri Imagery": lyrEsri,
        };

        capaColonias = L.Geoserver.wfs("http://localhost:8080/geoserver/wfs", {
          layers: "catastro:colonias_2020",
          onEachFeature: function (feature, layer) {
            attr = feature.properties;
            layer.bindPopup("<p>Colonia:<p>" + attr.colonia);
            arrayColonias.push(attr.colonia.toString())
          },
          fitLayer: false,
          style: {
            color: "purple",
            opacity: "0.5",
          },
        });
        $(function(){
          $('#txtFindColonia').autocomplete({
            source: arrayColonias
          })
        })


        capaDelegaciones = L.Geoserver.wfs(
          "http://localhost:8080/geoserver/wfs",
          {
            layers: "gobierno:delegaciones_2013",
            fitLayer: false,
          }
        );
        $(function(){
          $('#txtFindDelegacion').autocomplete({
            source: arrayDelegaciones
          })
        })

        // capaLuminarias = L.Geoserver.wfs('http://localhost:8080/geoserver/wfs', {
        //     layers: 'servicios:luminarias_2021'
        // });

        objOverlays = {
          Delegaciones: capaDelegaciones,
          Colonias: capaColonias,
          // 'Luminarias': capaLuminarias
        };

        ctrLayers = L.control.layers(objBasemaps, objOverlays).addTo(map2);


        map2.on("pm:create", function (e) {
          console.log(e.layer.getLatLngs());
        });

        map2.on("locationfound", function (e) {
          if (mrkCurrentLocation) {
            mrkCurrentLocation.remove();
          }
          mrkCurrentLocation = L.circle(e.latlng, {
            radius: 600,
          })
            .bindTooltip("Hello im here")
            .addTo(map2);
          map2.setView(e.latlng, 14);
        });

        map2.on("locationerror", function (e) {
          console.log(e);
          alert("Lacalizacion no encontrada");
        });

        $("#btnLocate").click(function () {
          map2.locate();
        });


        //PARA SEARCH DE COLONIA

        document.getElementById('btnFindColonia').onclick = function(){
          var col = document.getElementById('txtFindColonia').value.toUpperCase();
          var lyr = returnLayerByName(capaColonias, 'colonia', col);
          if (lyr){
            if (lyrSearchCol){
              lyrSearchCol.remove()
            }
            lyrSearchCol = L.geoJSON(lyr.toGeoJSON(), {style:{color:'red', weigth: 10, opacity: 0.5}}).addTo(map2);
            map2.fitBounds(lyr.getBounds().pad(1));
            $("#divFindColonia").removeClass("has-error");
            $('#divColoniaError').html("");
            var attr = lyr.feature.properties;
            $('#divColoniaData').html("<h4 clas='text-center'>Atributos</h4><h5>Colonia: "+attr.colonia+"</h5><h5>Area: "+attr.area+" m </h5>");
          } else {
            $('#divColoniaError').html("****** Colonia no excontrada ******");
          }
        }

        $('#txtFindColonia').on('keyup paste', function(){
          var col = $('#txtFindColonia').val();
          testLayerNameStatus(col);
        })

        // FORMULAS GENERALES

        function returnLayerByName(lyr, att, val) {
          var arLayer = lyr.getLayers();
          for (i = 0; i < arLayer.length; i++) {
            var featureCol = arLayer[i].feature.properties[att];
            if (featureCol == val) {
              return arLayer[i];
            }
          }
          return false;
        }

        function testLayerNameStatus(lyr, att){
          if (lyr.indexOf(att)<0){
            $("#divFindColonia").addClass("has-error");
            $("#btnFindColonia").attr("disabled", false);
          } else {
            $("#divFindColonia").removeClass("has-error");
            $("#divColoniaError").html("");
            $("#btnFindColonia").attr("disabled", true);
          }
        }
      });
    </script>
  </body>
</html>
