<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Acceso a la Información</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="src/leaflet/leaflet.css" />
  <script src="src/leaflet/leaflet.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

  <script src="src/jquery-3.7.0/jquery.js"></script>

  <link rel="stylesheet" href="src/jquery-3.7.0/jquery-ui.min.css" />
  <script src="src/jquery-3.7.0/jquery-ui.min.js"></script>

  <script src="src/L.crs/proj4leaflet.js"></script>

  <script src="src/leaflet.ajax/leaflet-ajax.min.js"></script>

  <script src="src/wfst/leaflet-wfst.src.js"></script>

  <script src="src/leaflet.geoserver/L.Geoserver.js"></script>

  <link rel="stylesheet" href="src/bootstrap-5.3.1-dist/css/bootstrap.min.css" />
  <script src="src/bootstrap-5.3.1-dist/js/bootstrap.min.js"></script>

  <link rel="stylesheet" href="src/fontawesome-6.4.2/css/all.min.css" />
  <script src="src/fontawesome-6.4.2/js/all.min.js"></script>

  <script src="src/turf/turf.min.js" charset="utf-8"></script>

  <link rel="stylesheet" href="src/geoman/leaflet-geoman.css" />
  <script src="src/geoman/leaflet-geoman.min.js"></script>

  <link rel="stylesheet" href="src/easybutton/easy-button.css" />
  <script src="src/easybutton/easy-button.js"></script>

  <link rel="stylesheet" href="src/sidebar/L.Control.Sidebar.css" />
  <script src="src/sidebar/L.Control.Sidebar.js"></script>

  <link rel="stylesheet" href="src/L.switchBasemap/L.switchBasemap.css" />
  <script src="src/L.switchBasemap/L.switchBasemap.js"></script>

  <link rel="stylesheet" href="src/leaflet.search/leaflet.search.css" />
  <script src="src/leaflet.search/leaflet.search.js"></script>

  <link rel="stylesheet" href="src/leaflet.styleEditor/css/Leaflet.StyleEditor.css" />
  <script src="src/leaflet.styleEditor/js/Leaflet.StyleEditor.js"></script>

  <script src="src/leaflet.providers/leaflet-providers.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="src/sheetjs/xlsx.full.min.js"></script>

  <script src="src/html2canvas/html2canvas.js"></script>

  <link rel="stylesheet" href="includes/css/style.css" />
  <link rel="stylesheet" href="includes/css/table.css" />
  <link rel="stylesheet" href="includes/css/loader.css" />
</head>

<body>
  <div id="estadisticas-bar" class="side-bar" style="border-radius: 1rem">
    <h4 class="mt-3">ESTADISTICAS</h4>
    <div id="statsTables"></div>
  </div>

  <div id="chart-bar" class="side-bar" style="border-radius: 1rem">
    <h4 class="mt-3">GRAFICAS</h4>
    <div id="chartContenedor"></div>
  </div>

  <div id="consulta-bar" class="side-bar" style="border-radius: 1rem">
    <h4 class="mt-3">CONSULTA CAPAS</h4>
    <ul id="layerSelects" class="list-group mt-4" style="list-style-type: none"></ul>

    <div id="tablaEst" class="text-center col-sm-12 mt-4"></div>

    <div id="radioDiv" class="text-center mt-3">
      <label id="lblRadioDist" class="form-label" for="radioDist">Radio de Selección: 500 m</label>
      <input type="range" id="radioDist" class="form-range" name="radioDist" min="300" max="1000" value="500" step="100" />
    </div>

    <div class="d-grid gap-2 mt-3">
      <button id="btnClear" class="btn">
        Limpiar todo
      </button>
    </div>

    <div class="d-grid gap-2 mt-3">
      <button id="btnTabla" class="btn btn-actions">
        Tabla
      </button>
    </div>
    
    <div class="d-grid gap-2 mt-3">
      <button id="btnGrafica" class="btn btn-actions">
        Grafica
      </button>
    </div>

    <div class="d-grid gap-2 mt-3">
      <button id="btnImprimir" class="btn btn-actions">
        Imprimir
      </button>
    </div>
  </div>

  <div id="loader"></div>

  <div id="mapdiv"></div>

  
  <script src="includes/js/procesamiento.js"></script>
  <script src="includes/js/apiGeoserver.js"></script>
  <script src="includes/js/generadorCapas.js"></script>
  <script src="includes/js/generadorTablas.js"></script>
  <script src="includes/js/generadorGraficas.js"></script>
  <script src="includes/js/imprimirSeleccion.js"></script>
  <script src="includes/js/loader.js"></script>
  <script src="includes/js/creacionElementosGeoserver.js"></script>
</body>

</html>
