<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de Acceso a la Información</title>

    <link rel="stylesheet" href="src/leaflet/leaflet.css" />
    <script src="src/leaflet/leaflet.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    
    <script src="src/jquery-3.7.0/jquery.js"></script>
    
    <link rel="stylesheet" href="src/jquery-3.7.0/jquery-ui.min.css" />
    <script src="src/jquery-3.7.0/jquery-ui.min.js"></script>

    <script src="src/L.crs/proj4leaflet.js"></script>

    <script src="src/leaflet.ajax/leaflet-ajax.min.js"></script>

    <script src="src/wfst/leaflet-wfst.src.js"></script>

    <script src="src/leaflet.geoserver/L.Geoserver.js"></script>

    <link rel="stylesheet" href="src/bootstrap-5.3.1-dist/css/bootstrap.min.css" />
    <script src="src/bootstrap-5.3.1-dist/js/bootstrap.min.js"></script>

    <link rel="stylesheet" href="src/fontawesome-6.4.2/css/all.min.css" />
    <script src="src/fontawesome-6.4.2/js/all.min.js"></script>

    <script src="src/turf/turf.min.js"></script>

    <link rel="stylesheet" href="src/geoman/leaflet-geoman.css" />
    <script src="src/geoman/leaflet-geoman.min.js"></script>

    <link rel="stylesheet" href="src/easybutton/easy-button.css" />
    <script src="src/easybutton/easy-button.js"></script>

    <link rel="stylesheet" href="src/sidebar/L.Control.Sidebar.css" />
    <script src="src/sidebar/L.Control.Sidebar.js"></script>
    
    <link rel="stylesheet" href="src/L.switchBasemap/L.switchBasemap.css" />
    <script src="src/L.switchBasemap/L.switchBasemap.js"></script>

    <!-- <link rel="stylesheet" href="src/leaflet.sidebarV2/leaflet-sidebar.min.css" />
    <script src="src/leaflet.sidebarV2/leaflet-sidebar.min.js"></script> -->

    <script src="src/leaflet.providers/leaflet-providers.js"></script>
    
    <link rel="stylesheet" href="src/leaflet.searchbox/Leaflet.AnimatedSearchBox.css" />
    <script src="src/leaflet.searchbox/Leaflet.AnimatedSearchBox.js"></script>

    <style>
      html,
      body,
      #mapdiv {
        height: 100%;
        font: 11pt "Helvetica Neue", Arial, Helvetica, sans-serif;
      }

      .errorMsg {
        padding: 0;
        text-align: center;
        background-color: salmon;
      }

      .col-xs-12,
      .col-xs-6,
      .col-xs-4 {
        padding: 3px;
      }

      .ui-autocomplete {
        max-height: 80%;
        overflow-y: auto;
        /* prevent horizontal scrollbar */
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="side-bar" class="sidebar collapsed">
      <div id="divCol" class="col-sm-12 mt-4">
        <div id="divColLabel" class="text-center col-sm-12"></div>
        <div id="divColoniaError" class="errorMsg col-xs-12"></div>
        <div id="divFindColonia" class="form-group d-flex justify-content-between col-sm-12">
          <div class="col-sm-6">
            <input
              type="text"
              id="txtFindColonia"
              class="form-control"
              placeholder="Nombre de colonia"
            />
          </div>
          <div class="col-sm-6">
            <button id="btnFindColonia" class="btn btn-warning btn-block" style="text-overflow: ellipsis;" disabled>
              Buscar Colonia
            </button>
          </div>
        </div>
        <div id="divColoniaData"></div>
      </div>

      <div id="divDel" class="col-sm-12 mt-4">
        <div id="divDelLabel" class="text-center col-sm-12"></div>
        <div id="divDelegacionError" class="errorMsg col-xs-12"></div>
        <div id="divFindDelegacion" class="form-group d-flex justify-content-between col-sm-12">
          <div class="col-sm-6">
            <input
              type="text"
              id="txtFindDelegacion"
              class="form-control"
              placeholder="Nombre de delegación"
            />
          </div>
          <div class="col-sm-6">
            <button id="btnFindDelegacion" class="btn btn-warning btn-block" style="text-overflow: ellipsis;" disabled>
              Buscar Delegación
            </button>
          </div>
        </div>
        <div id="divDelegacionData"></div>
      </div>

      <ul class="list-group mt-4" style="list-style-type: none;">
        <li class="form-control list-group-item list-group-item-action list-group-item-warning">
          <div class="form-switch">
            <input class="form-check-input me-3" type="checkbox" id="switchDelegaciones">Delegaciones
          </div>
        </li>
        <li class="form-control list-group-item list-group-item-action list-group-item-warning">
          <div class="form-switch">
            <input class="form-check-input me-3" type="checkbox" id="switchColonias">Colonias
          </div>
        </li>
        <li class="form-control list-group-item list-group-item-action list-group-item-warning">
          <div class="form-switch">
              <input class="form-check-input me-3" type="checkbox" id="switchRutasReco">Rutas de Recolección
          </div>
        </li>
        <li class="form-control list-group-item list-group-item-action list-group-item-warning">
          <div class="form-switch">
              <input class="form-check-input me-3" type="checkbox" id="switchFortamun">Bacheo Fortamun
          </div>
        </li>
        <li class="form-control list-group-item list-group-item-action list-group-item-warning">
          <div class="form-switch">
              <input class="form-check-input me-3" type="checkbox" id="switchDesarenadores">Desarenadores
          </div>
        </li>
      </ul>

      <div id="tablaEst" class="text-center col-sm-12 mt-4"></div>

      <div class="d-grid gap-2">
        <button id="btnLocate" class="btn btn-danger mt-4">Ubicame</button>
      </div>
    </div>
    <div id="mapdiv"></div>

    <script>
      var map2;
      var lyrOSM;
      var lyrEsri;
      var lyrContLumin;
      var lyrSearchCol;
      var lyrSearchDel;
      var lyrCurrentLoc;
      var jsonCurrentLocation;
      var ctrLayers;
      var ctrSidebar;
      var ctrEasybutton;
      var objBasemaps;
      var objOverlays;
      var capaColonias;
      var capaDelegaciones;
      var capaLuminarias;
      var capaSubsectores;
      var mrkCurrentLocation;
      var arrayColonias = [];
      var arrayDelegaciones = [];
      var pointsLayer;
      var drawnPolygon;
      var crs32611;
      var searchbox;

      $(document).ready(function () {
        map2 = L.map("mapdiv", {
          center: [32.50079, -116.932811],
          zoom: 12,
        });

        map2.pm.addControls({
          position: "topleft",
          drawMarker: false,
          drawCircle: true,
          drawCircleMarker: false,
          drawPolyline: false,
          drawText: false,
          editMode: false,
          dragMode: false,
          cutPolygon: false,
          removalMode: false,
          rotateMode: false,
        });

        ctrSidebar = L.control.sidebar("side-bar", {closeButton: false}).addTo(map2);

        ctrEasybutton = L.easyButton("fas fa-arrow-right", function () {
          ctrSidebar.toggle();
        }).addTo(map2);

        searchbox = L.control.searchbox({
            position: 'topright',
            expand: 'left',
            collapsed: true,
            id: 'searchItem',
            autocompleteFeatures: 'setValueOnClick',
            iconPath: './assets/img/search_icon.png',
        }).addTo(map2);

        new L.basemapsSwitcher([
          {
            layer: L.tileLayer.provider("OpenStreetMap.Mapnik").addTo(map2),
            icon: './assets/img/osm_switch.png',
            name: 'OSM',
          },
          {
            layer: L.tileLayer.provider("Esri.WorldImagery"),
            icon: './assets/img/esri_switch.png',
            name: 'Esri Map',
          },
        ], { position: 'bottomleft' }).addTo(map2);


        objBasemaps = {
          "Open Street Maps": lyrOSM,
          "Esri Imagery": lyrEsri,
        };

        pointsLayer = L.layerGroup().addTo(map2);
        drawnPolygon = L.layerGroup().addTo(map2);

        // capaLuminarias = L.Geoserver.wms("http://localhost:8080/geoserver/wms",
        //   {
        //     layers: "servicios:luminarias_2021",
        //     fitLayer: false,
        //   }
        // );

        // capaColonia = L.Geoserver.wfs("http://localhost:8080/geoserver/wfs", 
        //   {
        //     layers: "catastro:colonias_2020",
        //     onEachFeature: function (feature, layer) {
        //       attr = feature.properties;
        //       geom = layer.getLatLngs();
        //       layer.bindPopup("<p>Colonia:<p>" + attr.colonia);
        //       if (!arrayColonias.includes(attr.colonia)) {
        //         arrayColonias.push(attr.colonia.toString());
        //       }
        //     },
        //     fitLayer: false,
        //     style: {
        //       color: "purple",
        //       opacity: "0.5",
        //     },
        //   });
        //   $(function () {
        //     $("#txtFindColonia").autocomplete({
        //       source: arrayColonias,
        //     });
        //   });

        crs32611 = new L.Proj.CRS("EPSG:32611","+proj=utm +zone=11 +datum=WGS84 +units=m +no_defs +type=crs");


        capaDelegaciones = new L.WFS({
          url: 'http://10.10.250.97:8080/geoserver/wfs',
          typeNS: 'gobierno',
          typeName: 'delegaciones',
          geometryField: 'geom',
          crs: crs32611,
          style: {
              color: 'red',
              fillColor: 'blue',
              weight: 1
          }
        }).on('load', function (e) {
          var capad = e.target.toGeoJSON();
          capad.features.forEach(function (feature) {
            var layer = L.geoJSON(feature, {
              onEachFeature: function (feature, layer) {
                attr = feature.properties;
                geom = layer.getLatLngs();
                layer.bindPopup("<p>Delegacion:<p>" + attr.delegacion);
                if (!arrayDelegaciones.includes(attr.delegacion)) {
                  arrayDelegaciones.push(attr.delegacion.toString());
                }
              }
            })
          });
        });;
        $(function () {
          $("#txtFindDelegacion").autocomplete({
            source: arrayDelegaciones,
          });
        });

        capaRutasReco = new L.WFS({
          url: 'http://10.10.250.97:8080/geoserver/wfs',
          typeNS: 'servicios',
          typeName: 'rutas_recoleccion',
          geometryField: 'geom',
          crs: crs32611,
          style: {
              color: 'orange',
              weight: 3
          }
        });
        capaFortamun = new L.WFS({
          url: 'http://10.10.250.97:8080/geoserver/wfs',
          typeNS: 'doium',
          typeName: 'poligonos_fortamun_2023',
          geometryField: 'geom',
          crs: crs32611,
          style: {
              color: 'black',
              fillColor: 'black',
          }
        });

        capaDesarenadores = new L.WFS({
          url: 'http://10.10.250.97:8080/geoserver/wfs',
          typeNS: 'doium',
          typeName: 'pl_desarenadores',
          geometryField: 'geom',
          crs: crs32611,
        });

        capaColonias = new L.WFS({
          url: 'http://10.10.250.97:8080/geoserver/wfs',
          typeNS: 'catastro',
          typeName: 'colonias_2020',
          geometryField: 'geom',
          crs: crs32611,
          style: {
              fillColor: '#C8A2C8',
              color: 'pink',
              weight: 2,
              fillOpacity: 0,
          }
        }).on('load', function (e) {
          var capa = e.target.toGeoJSON();
          capa.features.forEach(function (feature) {
            var layer = L.geoJSON(feature, {
              onEachFeature: function (feature, layer) {
                attr = feature.properties;
                geom = layer.getLatLngs();
                layer.bindPopup("<p>Colonia:<p>" + attr.nomb_fracc);
                if (attr && attr.nomb_fracc !== undefined) {
                  if (!arrayColonias.includes(attr.nomb_fracc)) {
                    arrayColonias.push(attr.nomb_fracc.toString());
                  }
                }
              }
            })
          });
        });
        $(function(){
          $("#searchItem").autocomplete({
            source: arrayColonias,
          });
        });

        capaColonias.on("click", function (event) {
          if (mrkCurrentLocation) {
            mrkCurrentLocation.remove();
            lyrCurrentLoc.remove();
          }
          drawnPolygon.clearLayers();
          var selectedFeature = event.layer.toGeoJSON();
          lumProcess(selectedFeature.geometry);
        });

        // objOverlays = {
        //   Luminarias: capaLuminarias,
        //   Subsectores: capaSubsectores,
        //   Colonias: capaColonias,
        //   Delegaciones: capaDelegaciones,
        //   'Rutas Recolección': capaRutasReco,
        //   'Bacheo Fortamun': capaFortamun,
        //   Desarenadores: capaDesarenadores
        // };
        // ctrLayers = L.control.layers('' ,objOverlays).addTo(map2);

        map2.on("pm:create", function (e) {
          drawnPolygon.clearLayers();
          const selectedRec = e.layer.toGeoJSON();
          drawnPolygon.addLayer(e.layer);
          lumProcess(selectedRec.geometry);
          console.log(selectedRec.geometry);
        });

        map2.on("locationfound", function (e) {
          if (mrkCurrentLocation) {
            mrkCurrentLocation.remove();
            lyrCurrentLoc.remove();
          }
          mrkCurrentLocation = L.marker(e.latlng).addTo(map2);
          map2.setView(e.latlng, 16);
          jsonCurrentLocation = turf.buffer(mrkCurrentLocation.toGeoJSON(), 0.6, {units: 'kilometers'});
          lyrCurrentLoc = L.geoJSON(jsonCurrentLocation, {style:{color: 'blue', fillColor: 'blue', fillOpacity: 0.2}}).addTo(map2);

          drawnPolygon.clearLayers();
          lumProcess(jsonCurrentLocation.geometry);
        });

        map2.on("locationerror", function (e) {
          console.log(e);
          alert("Lacalizacion no encontrada");
        });

        $("#btnLocate").click(function () {
          map2.locate();
        });

        document.getElementById('switchColonias').addEventListener('change', function() {
          if (this.checked) {
            capaColonias.addTo(map2);
          } else {
            map2.removeLayer(capaColonias);
          }
        });
        document.getElementById('switchDelegaciones').addEventListener('change', function() {
          if (this.checked) {
            capaDelegaciones.addTo(map2);
          } else {
            map2.removeLayer(capaDelegaciones);
          }
        });
        document.getElementById('switchRutasReco').addEventListener('change', function() {
          if (this.checked) {
            capaRutasReco.addTo(map2);
          } else {
            map2.removeLayer(capaRutasReco);
          }
        });
        document.getElementById('switchFortamun').addEventListener('change', function() {
          if (this.checked) {
            capaFortamun.addTo(map2);
          } else {
            map2.removeLayer(capaFortamun);
          }
        });
        document.getElementById('switchDesarenadores').addEventListener('change', function() {
          if (this.checked) {
            capaDesarenadores.addTo(map2);
          } else {
            map2.removeLayer(capaDesarenadores);
          }
        });

        //PARA SEARCH DE COLONIA

        document.getElementById("btnFindColonia").onclick = function () {
          var col = document.getElementById("txtFindColonia").value.toUpperCase();
          var lyr = returnLayerByName(capaColonias, "nomb_fracc", col);
          if (lyr) {
            if (lyrSearchCol) {
              lyrSearchCol.remove();
            }
            lyrSearchCol = L.geoJSON(lyr.toGeoJSON(), {
              style: { color: "red", weigth: 10, opacity: 0.5 },
            }).addTo(map2);
            map2.fitBounds(lyr.getBounds().pad(1));
            $("#divFindColonia").removeClass("has-error");
            $("#divColoniaError").html("");
            var attr = lyr.feature.properties;
            $("#divColoniaData").html(
              "<h4 class='text-center'>Atributos</h4><h5>Colonia: " +
                attr.nomb_fracc +
                "</h5><h5>Area: " +
                attr.area +
                " m </h5>"
            );
          } else {
            $("#divColoniaError").html("****** Colonia no encontrada ******");
          }
        };

        $("#txtFindColonia").on("keyup paste", function () {
          var col = $("#txtFindColonia").val();
          testLayerNameStatus(
            arrayColonias,
            col,
            "#divFindColonia",
            "#btnFindColonia"
          );
        });

        //PARA SEARCH DE DELEGACION

        document.getElementById("btnFindDelegacion").onclick = function () {
          var del = document.getElementById("txtFindDelegacion").value;
          var lyr = returnLayerByName(capaDelegaciones, "delegacion", del);
          if (lyr) {
            if (lyrSearchDel) {
              lyrSearchDel.remove();
            }
            lyrSearchDel = L.geoJSON(lyr.toGeoJSON(), {
              style: { color: "yellow", weigth: 10, opacity: 0.5 },
            }).addTo(map2);
            map2.fitBounds(lyr.getBounds().pad(1));
            $("#divFindDelegacion").removeClass("has-error");
            $("#divDelegacionError").html("");
            var attr = lyr.feature.properties;
            $("#divDelegacionData").html(
              "<h4 class='text-center'>Atributos</h4><h5>Delegacion: " +
                attr.delegacion +
                "</h5><h5>Area: " +
                attr.area +
                " m </h5>"
            );
          } else {
            $("#divDelegacionError").html(
              "****** Delegacion no encontrada ******"
            );
          }
        };

        $("#txtFindDelegacion").on("keyup paste", function () {
          var del = $("#txtFindDelegacion").val();
          testLayerNameStatus(
            arrayDelegaciones,
            del,
            "#divFindDelegacion",
            "#btnFindDelegacion"
          );
        });

        // FORMULAS GENERALES

        function returnLayerByName(lyr, att, val) {
          var arLayer = lyr.getLayers();
          for (i = 0; i < arLayer.length; i++) {
            var featureCol = arLayer[i].feature.properties[att];
            if (featureCol == val) {
              return arLayer[i];
            }
          }
          return false;
        }

        function testLayerNameStatus(arr, val, divFind, btnFind) {
          if (arr.indexOf(val) < 0) {
            $(divFind).addClass("has-error");
            $(btnFind).attr("disabled", false);
          } else {
            $(divFind).removeClass("has-error");
            $(btnFind).attr("disabled", true);
          }
        }

        function lumProcess(geom) {
          pointsLayer.clearLayers();
          $.ajax({
            type: "POST",
            url: "dataExtractor.php",
            data: JSON.stringify(geom),
            contentType: "json",
            success: function (data) {
              const intersectedGeoJSON = JSON.parse(data);
              $("#tablaEst").html(
              "<h4 class='text-center'>Atributos de Selección</h4><h5>Cantidad de Lums: " +
                intersectedGeoJSON.features.length +
                "</h5>"
            );
              console.log(intersectedGeoJSON);
              L.geoJSON(intersectedGeoJSON, {
                pointToLayer: function (feature, latlng) {
                  return L.circleMarker(latlng, {
                    radius: 3,
                    fillColor: "yellow",
                    color: "black",
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8,
                  });
                },
                onEachFeature: function (feature, layer) {
                  pointsLayer.addLayer(layer);
                },
              }).addTo(map2);
            },
            error: function (error) {
              console.error("Error:", error);
            },
          });
        }
      });
    </script>
  </body>
</html>
